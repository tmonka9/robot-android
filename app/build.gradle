plugins {
    id 'com.android.application'
}

android {
    namespace 'com.falcon.robot'
    compileSdk 34

    defaultConfig {
        applicationId "com.falcon.robot"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // whisper.cpp (speech recognition) is built from app/src/main/cpp
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-O3 -fexceptions -frtti'
            }
        }
        ndk {
            // 64-bit ARM for the tablet, x86_64 for the emulator
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    // the built file is falcon.ai.robot.apk rather than app-debug.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "falcon.ai.robot.apk"
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidResources {
        // keep the TFLite and ggml models uncompressed inside the APK
        noCompress 'tflite', 'bin'
    }
}

dependencies {
    // aligns the Kotlin stdlib pulled in by CameraX (avoids duplicate-class errors)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    // ComponentActivity (lifecycle owner for CameraX, permission request API)
    implementation 'androidx.activity:activity:1.8.2'

    // Camera preview + frame analysis (1.3.x supports compileSdk 34)
    def camerax_version = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // On-device face detection (bundled model, works offline)
    implementation 'com.google.mlkit:face-detection:16.1.6'

    // MobileFaceNet embeddings (assets/mobilefacenet.tflite)
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
}
